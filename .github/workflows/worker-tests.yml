name: DHONG quality checks
on:
  push:
    branches: [main, secure-dhong-backend]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify project structure and JavaScript syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
