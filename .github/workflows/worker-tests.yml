name: Worker tests
on:
  push:
    branches: [secure-dhong-backend]
  pull_request:
    branches: [main]
    paths:
      - "worker.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/worker-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
