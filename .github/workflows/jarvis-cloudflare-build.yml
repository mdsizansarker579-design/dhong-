name: JARVIS Cloudflare build

on:
  push:
    branches: [jarvis-cloudflare-migration]
    paths:
      - "jarvis/web/**"
      - ".github/workflows/jarvis-cloudflare-build.yml"
  pull_request:
    paths:
      - "jarvis/web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
