<!-- ===== DHONG ADMIN UPDATE: admin.html এর </body> ট্যাগের ঠিক আগে এই পুরো অংশ (style + section + script) পেস্ট করুন ===== -->
<style>
.nav button{display:flex;align-items:center;gap:8px}
[data-act="delOrder"]::before,[data-act="delProduct"]::before,[data-act="delC"]::before,[data-act="delMod"]::before,[data-act="delAff"]::before,[data-act="delW"]::before,[data-act="delRev"]::before,[data-act="delCat"]::before{content:'🗑️ '}
[data-act="editProduct"]::before,[data-act="editOrder"]::before,[data-act="editRev"]::before,[data-act="renCat"]::before{content:'✏️ '}
[data-act="copy"]::before{content:'📋 '}
[data-act="trackCourier"]::before{content:'📦 '}
[data-act="pay"]::before{content:'💸 '}
[data-act="rejectW"]::before{content:'✖️ '}
[data-act="apprC"]::before{content:'✅ '}
[data-act="toggleMod"]::before{content:'🔒 '}
#exportCsv::before{content:'⬇️ '}#syncTrackBtn::before{content:'🔄 '}#saveProductBtn::before{content:'💾 '}
#cancelEdit::before{content:'↩️ '}#vGen::before{content:'✨ '}#vAdd::before{content:'➕ '}
#addModBtn::before{content:'➕ '}#cTest::before{content:'🔌 '}#loginBtn::before{content:'🔐 '}
#logoutBtn::before{content:'🚪 '}#quickOfferBtn::before{content:'⏱️ '}#migrateBtn::before{content:'☁️ '}#feedBtn::before{content:'📤 '}
.sec-ico{font-size:18px;margin-right:6px}
</style>

<section class="page" id="store">
  <div class="card">
    <h3 class="section-title"><span class="sec-ico">🏷️</span>ক্যাটাগরি ম্যানেজার (নাম বদলান / মুছুন)</h3>
    <div id="catMgr"></div>
  </div>
  <div class="card">
    <h3 class="section-title"><span class="sec-ico">💬</span>প্রকাশিত কাস্টমার রিভিউ (এডিট / ডিলিট)</h3>
    <div id="revMgr"></div>
  </div>
</section>

<script>
(function () {
  const ICON = { dashboard: '📊', orders: '🧾', products: '🛍️', comments: '💬', affiliates: '🤝', moderators: '🛡️', profit: '💰', courier: '🚚', api: '⚙️' };
  document.querySelectorAll('.nav button').forEach(b => {
    const ic = ICON[b.dataset.page]; if (!ic) return;
    const label = b.textContent.replace(/\(\d+\)/, '').replace(/^[^A-Za-z]+/, '').trim();
    b.innerHTML = '<span>' + ic + '</span><span>' + label + '</span>' + (b.dataset.page === 'comments' ? '<span id="pendingCommentBadge"></span>' : '');
  });
  document.querySelector('[data-page="comments"]').insertAdjacentHTML('beforebegin', '<button data-page="store" data-title="Storefront Manager"><span>🏬</span><span>Storefront</span></button>');
  const sb = document.querySelector('[data-page="store"]'), sp = document.getElementById('store');
  document.getElementById('comments').parentNode.insertBefore(sp, document.getElementById('comments'));
  sb.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
    sb.classList.add('active'); sp.classList.add('active');
    $('pageTitle').textContent = 'Storefront Manager'; renderStore();
  });

  let approved = [];
  const _sl = window.startListeners;
  window.startListeners = function () {
    _sl();
    listen('dhong_comments', s => {
      approved = [];
      s.forEach(ps => ps.forEach(cs => { const v = cs.val(); if (v && typeof v === 'object') approved.push(Object.assign({}, v, { pid: ps.key, cid: cs.key })); }));
      renderStore();
    });
  };
  const _r = window.render;
  window.render = function () { _r(); try { extra(); renderStore(); } catch (e) { console.error(e); } };

  function extra() {
    document.querySelectorAll('#orderRows [data-act="delOrder"]').forEach(b => {
      if (b.parentElement.querySelector('[data-act="editOrder"]')) return;
      b.insertAdjacentHTML('beforebegin', '<button class="btn sm amber" data-act="editOrder" data-key="' + esc(b.dataset.key) + '">এডিট</button> ');
    });
    const ah = $('affiliateRows').closest('table').querySelector('thead tr');
    if (ah && ah.children.length === 3) ah.insertAdjacentHTML('beforeend', '<th></th>');
    document.querySelectorAll('#affiliateRows tr').forEach((tr, i) => {
      if (tr.children.length === 3 && affiliates[i]) tr.insertAdjacentHTML('beforeend', '<td><button class="btn sm red" data-act="delAff" data-key="' + esc(affiliates[i]._key) + '">ডিলিট</button></td>');
    });
    document.querySelectorAll('#withdrawRows tr').forEach((tr, i) => {
      const td = tr.lastElementChild;
      if (withdrawals[i] && td && !td.querySelector('[data-act="delW"]')) td.insertAdjacentHTML('beforeend', ' <button class="btn sm red" data-act="delW" data-key="' + esc(withdrawals[i]._key) + '">ডিলিট</button>');
    });
  }
  function renderStore() {
    const cats = {}; products.forEach(p => { if (p.cat) cats[p.cat] = (cats[p.cat] || 0) + 1; });
    $('catMgr').innerHTML = Object.keys(cats).map(c => `<div class="row"><div><b>🏷️ ${esc(c)}</b> <small>(${cats[c]}টি পণ্য)</small></div>
      <div><button class="btn sm blue" data-act="renCat" data-cat="${esc(c)}">নাম বদলান</button> <button class="btn sm red" data-act="delCat" data-cat="${esc(c)}">ক্যাটাগরিসহ পণ্য ডিলিট</button></div></div>`).join('') || '<div class="empty">কোনো ক্যাটাগরি নেই।</div>';
    $('revMgr').innerHTML = approved.map(c => {
      const p = products.find(x => String(x.id) === String(c.pid));
      return `<div class="row"><div style="flex:1;min-width:200px"><b>${esc(c.name)}</b> → ${esc(p ? p.name : c.pid)}<br><small>${esc(c.text)}</small></div>
      <div><button class="btn sm blue" data-act="editRev" data-pid="${esc(c.pid)}" data-cid="${esc(c.cid)}">এডিট</button> <button class="btn sm red" data-act="delRev" data-pid="${esc(c.pid)}" data-cid="${esc(c.cid)}">ডিলিট</button></div></div>`;
    }).join('') || '<div class="empty">কোনো প্রকাশিত রিভিউ নেই।</div>';
  }

  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
    const d = b.dataset;
    try {
      if (d.act === 'renCat') {
        const n = (prompt('ক্যাটাগরির নতুন নাম:', d.cat) || '').trim(); if (!n || n === d.cat) return;
        const u = {}; products.filter(p => p.cat === d.cat).forEach(p => u['dhong_products/' + p._key + '/cat'] = n);
        if (catImgs[d.cat]) { catImgs[n] = catImgs[d.cat]; delete catImgs[d.cat]; u['dhong_settings/catImagesJson'] = JSON.stringify(catImgs); }
        await db.ref().update(u); toast('✅ ক্যাটাগরির নাম বদলেছে');
      }
      if (d.act === 'delCat') {
        const list = products.filter(p => p.cat === d.cat);
        if (!confirm('"' + d.cat + '" ক্যাটাগরির ' + list.length + 'টি পণ্যসহ সব মুছে যাবে। নিশ্চিত?')) return;
        const u = {}; list.forEach(p => { u['dhong_products/' + p._key] = null; u['dhong_images/' + p.id] = null; });
        if (catImgs[d.cat]) { delete catImgs[d.cat]; u['dhong_settings/catImagesJson'] = JSON.stringify(catImgs); }
        await db.ref().update(u); toast('✅ ক্যাটাগরি মুছে গেছে');
      }
      if (d.act === 'editRev') {
        const c = approved.find(x => x.pid === d.pid && x.cid === d.cid); if (!c) return;
        const t = prompt('রিভিউ এডিট করুন:', c.text); if (t === null || !t.trim()) return;
        await db.ref('dhong_comments/' + d.pid + '/' + d.cid + '/text').set(t.trim().slice(0, 500)); toast('✅ রিভিউ আপডেট হয়েছে');
      }
      if (d.act === 'delRev' && confirm('এই রিভিউ সাইট থেকে মুছে ফেলবেন?')) { await db.ref('dhong_comments/' + d.pid + '/' + d.cid).remove(); toast('✅ রিভিউ মুছে গেছে'); }
      if (d.act === 'delAff' && confirm('এফিলিয়েট "' + d.key + '" ডিলিট করবেন? তার ব্যালেন্সও মুছে যাবে।')) { await db.ref('dhong_affiliates/' + d.key).remove(); toast('✅ এফিলিয়েট মুছে গেছে'); }
      if (d.act === 'delW' && confirm('এই উইথড্রল রেকর্ড মুছবেন?')) { await db.ref('dhong_withdrawals/' + d.key).remove(); toast('✅ মুছে গেছে'); }
      if (d.act === 'editOrder') {
        const o = orders.find(x => x._key === d.key); if (!o) return;
        const name = prompt('কাস্টমারের নাম:', o.customer_name || ''); if (name === null) return;
        const phone = prompt('মোবাইল নম্বর:', o.phone || ''); if (phone === null) return;
        const addr = prompt('ঠিকানা:', o.address || ''); if (addr === null) return;
        const oldKey = await trackKey(o);
        await db.ref('dhong_orders/' + d.key).update({ customer_name: name.trim(), phone: phone.trim(), address: addr.trim() });
        if (phone.trim() !== o.phone) await db.ref('dhong_track/' + oldKey).remove().catch(() => {});
        await syncTrack(d.key, { phone: phone.trim() });
        toast('✅ অর্ডার আপডেট হয়েছে');
      }
    } catch (err) { fail(err); }
  });
})();
</script>
